<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="CodeReel — code debugger and analyser">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131519" />
      <stop offset="0.55" stop-color="#171a20" />
      <stop offset="1" stop-color="#101f2b" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b6fa4" />
      <stop offset="0.62" stop-color="#57c4ff" />
      <stop offset="1" stop-color="#8be0ff" />
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.05" r="0.8">
      <stop offset="0" stop-color="#57c4ff" stop-opacity="0.28" />
      <stop offset="1" stop-color="#57c4ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1" r="0.7">
      <stop offset="0" stop-color="#d18ae0" stop-opacity="0.2" />
      <stop offset="1" stop-color="#d18ae0" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- brand mark -->
  <g transform="translate(80 76)">
    <rect width="64" height="64" rx="16" fill="url(#accent)" opacity="0.18" />
    <circle cx="28" cy="28" r="14" fill="none" stroke="url(#accent)" stroke-width="4" />
    <path d="M24 21.5 L34 28 L24 34.5 Z" fill="#f4f6fa" />
    <path d="M38.5 38.5 L51 51" stroke="#57c4ff" stroke-width="5" stroke-linecap="round" />
  </g>

  <text x="164" y="112" fill="#f4f6fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-0.5">CodeReel</text>
  <text x="164" y="140" fill="#7f8897" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">Code Debugger &amp; Analyser</text>

  <text x="80" y="248" fill="#f4f6fa" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.4">Understand code,</text>
  <text x="80" y="310" fill="#57c4ff" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="750" letter-spacing="-1.4">one frame at a time.</text>
  <text x="80" y="362" fill="#a3acba" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21">Step through execution, watch data structures change,</text>
  <text x="80" y="392" fill="#a3acba" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21">and understand complexity — in eight languages.</text>

  <!-- code panel -->
  <g transform="translate(660 120)">
    <rect width="470" height="380" rx="16" fill="#1b1d22" stroke="#333842" stroke-width="1.5" />
    <rect width="470" height="44" rx="16" fill="#1f2228" />
    <rect y="28" width="470" height="16" fill="#1f2228" />
    <circle cx="24" cy="22" r="5" fill="#ff8f7d" />
    <circle cx="42" cy="22" r="5" fill="#e3d98a" />
    <circle cx="60" cy="22" r="5" fill="#4ec9b0" />
    <text x="88" y="27" fill="#7f8897" font-family="Consolas, monospace" font-size="13">two-sum.js</text>

    <g font-family="Consolas, monospace" font-size="15">
      <text x="26" y="86" fill="#d18ae0">function</text>
      <text x="112" y="86" fill="#e3d98a">twoSum</text>
      <text x="184" y="86" fill="#a3acba">(nums, target) {</text>

      <text x="42" y="118" fill="#d18ae0">const</text>
      <text x="100" y="118" fill="#9edcff">seen</text>
      <text x="150" y="118" fill="#a3acba">= </text>
      <text x="170" y="118" fill="#4ec9b0">new Map</text>
      <text x="248" y="118" fill="#a3acba">();</text>

      <text x="42" y="150" fill="#d18ae0">for</text>
      <text x="80" y="150" fill="#a3acba">(</text>
      <text x="92" y="150" fill="#d18ae0">let</text>
      <text x="126" y="150" fill="#9edcff">i</text>
      <text x="140" y="150" fill="#a3acba">= 0; i &lt; nums.length; i++) {</text>

      <text x="58" y="182" fill="#d18ae0">const</text>
      <text x="116" y="182" fill="#9edcff">need</text>
      <text x="170" y="182" fill="#a3acba">= target - nums[i];</text>

      <text x="58" y="214" fill="#d18ae0">if</text>
      <text x="84" y="214" fill="#a3acba">(seen.has(need))</text>
      <text x="248" y="214" fill="#d18ae0">return</text>

      <text x="320" y="214" fill="#a3acba">[seen.get(need), i];</text>

      <text x="58" y="246" fill="#9edcff">seen</text>
      <text x="106" y="246" fill="#a3acba">.set(nums[i], i);</text>

      <text x="42" y="278" fill="#a3acba">}</text>
      <text x="26" y="310" fill="#a3acba">}</text>
    </g>

    <rect x="26" y="336" width="418" height="26" rx="6" fill="#57c4ff" opacity="0.12" />
    <text x="38" y="354" fill="#9edcff" font-family="Consolas, monospace" font-size="12">▶ step 4 / 12 · i = 1 · need = 2 · seen = {2: 0}</text>
  </g>

  <!-- feature chips -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">
    <rect x="80" y="470" width="168" height="42" rx="21" fill="#57c4ff" opacity="0.12" />
    <text x="104" y="497" fill="#9edcff">8 languages</text>

    <rect x="264" y="470" width="186" height="42" rx="21" fill="#4ec9b0" opacity="0.12" />
    <text x="288" y="497" fill="#4ec9b0">Big-O analysis</text>

    <rect x="466" y="470" width="176" height="42" rx="21" fill="#d18ae0" opacity="0.12" />
    <text x="490" y="497" fill="#d18ae0">Live variables</text>

    <rect x="658" y="470" width="152" height="42" rx="21" fill="#e3d98a" opacity="0.12" />
    <text x="682" y="497" fill="#e3d98a">Share links</text>
  </g>

  <text x="80" y="574" fill="#7f8897" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17">codereel.dev · no account · JavaScript and TypeScript traced entirely in your browser</text>
</svg>
